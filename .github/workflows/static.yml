<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daneshwari Global · Export House</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Google Font (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #faf8f5;
      color: #1e1e2a;
      line-height: 1.5;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* header */
    .header {
      padding: 2rem 0 1.2rem;
      border-bottom: 1px solid #e5e0d8;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #1f3a4b;
    }
    .logo span {
      color: #b8863d;
    }
    .logo .tag {
      display: block;
      font-size: 0.9rem;
      font-weight: 400;
      color: #4d5f6e;
      letter-spacing: 0.4px;
      margin-top: 0.2rem;
    }
    .logo .tag i {
      color: #b8863d;
      margin-right: 6px;
    }

    .contact-header {
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      background: #f0ede7;
      padding: 0.6rem 1.5rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1f2e3b;
    }
    .contact-header i {
      color: #b8863d;
      margin-right: 4px;
    }
    .contact-header a {
      color: #1f2e3b;
      text-decoration: none;
    }

    /* hero */
    .hero {
      margin: 2.5rem 0 2.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #f0ede7;
      border-radius: 32px;
      padding: 2.5rem 3rem;
    }

    .hero-text {
      flex: 1 1 300px;
    }
    .hero-text h2 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #1f2e3b;
    }
    .hero-text h2 i {
      color: #b8863d;
      margin-right: 6px;
    }
    .hero-text .tagline-hero {
      font-size: 1.2rem;
      font-weight: 400;
      color: #3f4d5a;
      margin-top: 0.5rem;
      font-style: italic;
      border-left: 4px solid #b8863d;
      padding-left: 1rem;
    }
    .hero-text p {
      margin-top: 0.8rem;
      font-size: 1rem;
      color: #3f4d5a;
      max-width: 450px;
    }
    .hero-badge {
      margin-top: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      background: #1f3a4b;
      color: white;
      padding: 0.6rem 1.5rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .hero-badge i {
      color: #f5c542;
    }

    .hero-flag {
      flex: 0 0 auto;
      font-size: 3rem;
      background: white;
      padding: 1rem 1.8rem;
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
      letter-spacing: 4px;
    }

    /* section title */
    .section-title {
      font-size: 1.9rem;
      font-weight: 700;
      margin: 3rem 0 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-title i {
      color: #b8863d;
      font-size: 2rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .product-card {
      background: white;
      border-radius: 28px;
      padding: 1.8rem 1.5rem 1.8rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03);
      border: 1px solid #ede9e1;
      transition: transform 0.15s ease, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 35px -8px rgba(0,0,0,0.06);
      border-color: #d6cec0;
    }

    .product-image {
      width: 100%;
      height: 160px;
      background: #e9e4db;
      border-radius: 20px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7a8a9a;
      font-size: 0.9rem;
      font-weight: 500;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="%23b8863d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 40px 40px;
    }
    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    .product-icon {
      font-size: 2.4rem;
      color: #1f3a4b;
      background: #f2eee8;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .product-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #1a2c3a;
      margin-bottom: 0.3rem;
    }

    .product-card .category-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #b8863d;
      font-weight: 600;
      background: #f4eee4;
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      margin-bottom: 0.6rem;
      align-self: flex-start;
    }

    .product-card p {
      color: #4b5a66;
      font-size: 0.95rem;
      margin-top: 0.25rem;
      flex: 1;
    }

    .product-card ul {
      list-style: none;
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: #2f4050;
    }
    .product-card ul li {
      padding: 0.2rem 0;
      border-bottom: 1px dashed #f0ebe3;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .product-card ul li i {
      color: #b8863d;
      font-size: 0.6rem;
    }

    .product-card .origin {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #7f8b96;
      border-top: 1px dashed #e0d9cf;
      padding-top: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .product-card .origin i {
      color: #b8863d;
    }

    /* inquiry form */
    .inquiry-section {
      background: #f0ede7;
      border-radius: 40px;
      padding: 2.5rem 3rem;
      margin: 3rem 0 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
    }

    .inquiry-info h3 {
      font-size: 2rem;
      font-weight: 700;
      color: #1f2e3b;
      margin-bottom: 0.8rem;
    }
    .inquiry-info p {
      color: #3f4d5a;
      margin-bottom: 1.5rem;
    }
    .inquiry-info .contact-detail {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0.5rem 0;
      color: #1f2e3b;
    }
    .inquiry-info .contact-detail i {
      color: #b8863d;
      width: 24px;
      text-align: center;
    }

    .inquiry-form form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .inquiry-form input,
    .inquiry-form textarea,
    .inquiry-form select {
      padding: 0.8rem 1.2rem;
      border-radius: 40px;
      border: 1px solid #d6cec0;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      background: white;
      transition: 0.2s;
    }
    .inquiry-form input:focus,
    .inquiry-form textarea:focus,
    .inquiry-form select:focus {
      outline: none;
      border-color: #b8863d;
      box-shadow: 0 0 0 3px rgba(184, 134, 61, 0.15);
    }
    .inquiry-form textarea {
      border-radius: 24px;
      min-height: 100px;
      resize: vertical;
    }
    .inquiry-form button {
      background: #1f3a4b;
      color: white;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      align-self: flex-start;
    }
    .inquiry-form button:hover {
      background: #b8863d;
      transform: scale(1.02);
    }

    .address-block {
      background: white;
      padding: 1.2rem 2rem;
      border-radius: 60px;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      border: 1px solid #ddd8cf;
      margin-top: 0.8rem;
    }
    .address-block i {
      color: #b8863d;
      margin-right: 4px;
    }

    .footer {
      margin: 4rem 0 2rem;
      border-top: 1px solid #ddd8cf;
      padding-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: #4d5e6b;
    }

    .footer i {
      color: #b8863d;
      margin: 0 0.2rem;
    }

    @media (max-width: 768px) {
      .inquiry-section {
        grid-template-columns: 1fr;
        padding: 2rem 1.5rem;
      }
      .inquiry-form button {
        align-self: stretch;
        text-align: center;
      }
    }

    @media (max-width: 640px) {
      .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 1.5rem;
        padding: 2rem 1.5rem;
      }
      .hero-text h2 {
        font-size: 2rem;
      }
      .hero-flag {
        font-size: 2.2rem;
        padding: 0.5rem 1.2rem;
        align-self: flex-start;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .contact-header {
        padding: 0.6rem 1rem;
        flex-wrap: wrap;
        border-radius: 30px;
      }
      .address-block {
        padding: 1rem 1.2rem;
        border-radius: 30px;
        font-size: 0.8rem;
      }
      .inquiry-section {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <h1>🌐 <span>Daneshwari</span> Global</h1>
      <span class="tag"><i class="fas fa-quote-left"></i> with daneshwari's grace, we trade the world</span>
    </div>
    <div class="contact-header">
      <span><i class="fas fa-envelope"></i> <a href="mailto:info@daneshwariglobal.com">info@daneshwariglobal.com</a></span>
      <span><i class="fas fa-globe"></i> www.daneshwariglobal.com</span>
      <span><i class="fab fa-whatsapp"></i> +91 9834196880</span>
      <span><i class="fas fa-phone-alt"></i> +91 9834196880</span>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <h2><i class="fas fa-box-open"></i> Fresh export <br />portfolio</h2>
      <div class="tagline-hero">“ with daneshwari's grace, we trade the world ”</div>
      <p>Handpicked from India's finest clusters — ready for global buyers.</p>
      <div class="hero-badge">
        <i class="fas fa-globe-asia"></i> 7 product lines · worldwide shipping
      </div>
    </div>
    <div class="hero-flag">
      <i class="fas fa-flag"></i> 🇮🇳
    </div>
  </section>

  <!-- ADDRESS -->
  <div class="address-block">
    <i class="fas fa-location-dot"></i> 102 C, 64 Bhavani Peth, Solapur – 413002, India
    <span style="margin: 0 0.3rem;">|</span>
    <i class="fas fa-envelope"></i> info@daneshwariglobal.com
    <span style="margin: 0 0.3rem;">|</span>
    <i class="fas fa-phone"></i> +91 9834196880
  </div>

  <!-- PRODUCT GRID -->
  <div class="section-title">
    <i class="fas fa-th-large"></i> Export catalog
    <span style="font-size: 1rem; font-weight: 400; margin-left: 12px; color: #6b7b88;">Newly listed</span>
  </div>

  <div class="product-grid">

    <!-- 1) Terry Towel -->
    <div class="product-card">
      <div class="product-image" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23b8863d%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22 ry=%222%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/><polyline points=%2221 15 16 10 5 21%22/></svg>'); background-size: 50px 50px;"></div>
      <span class="category-tag">Textile</span>
      <h3>Terry Towel</h3>
      <p>Premium 100% cotton, zero-twist, high GSM.</p>
      <ul>
        <li><i class="fas fa-circle"></i> Hand Towel</li>
        <li><i class="fas fa-circle"></i> Bath Towel</li>
        <li><i class="fas fa-circle"></i> Face Towel</li>
        <li><i class="fas fa-circle"></i> Beach Towel</li>
        <li><i class="fas fa-circle"></i> Kitchen Towel</li>
      </ul>
      <div class="origin"><i class="fas fa-map-pin"></i> Tamil Nadu, India</div>
    </div>

    <!-- 2) Ilkal Saree -->
    <div class="product-card">
      <div class="product-image" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23b8863d%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22 ry=%222%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/><polyline points=%2221 15 16 10 5 21%22/></svg>'); background-size: 50px 50px;"></div>
      <span class="category-tag">Handloom</span>
      <h3>Ilkal Saree</h3>
      <p>Traditional Karnataka saree with distinctive pallu and temple border.</p>
      <div class="origin"><i class="fas fa-map-pin"></i> Bagalkot, Karnataka</div>
    </div>

    <!-- 3) Rice -->
    <div class="product-card">
      <div class="product-image" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23b8863d%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22 ry=%222%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/><polyline points=%2221 15 16 10 5 21%22/></svg>'); background-size: 50px 50px;"></div>
      <span class="category-tag">Agri-commodity</span>
      <h3>Premium Rice</h3>
      <p>Basmati &amp; non-basmati, premium quality.</p>
      <ul>
        <li><i class="fas fa-circle"></i> 1121 Steam</li>
        <li><i class="fas fa-circle"></i> 1121 Sella (Golden)</li>
        <li><i class="fas fa-circle"></i> 1121 Raw</li>
        <li><i class="fas fa-circle"></i> 1509 Steam</li>
        <li><i class="fas fa-circle"></i> 1509 Sella</li>
        <li><i class="fas fa-circle"></i> Sona Masoori</li>
      </ul>
      <div class="origin"><i class="fas fa-map-pin"></i> Punjab &amp; Andhra</div>
    </div>

    <!-- 4) Ilkal Granite & WhiteStone -->
    <div class="product-card">
      <div class="product-image" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23b8863d%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22 ry=%222%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/><polyline points=%2221 15 16 10 5 21%22/></svg>'); background-size: 50px 50px;"></div>
      <span class="category-tag">Natural stone</span>
      <h3>Ilkal Granite &amp; White Stone</h3>
      <p>High-density granite &amp; white sandstone, ideal for cladding &amp; paving.</p>
      <div class="origin"><i class="fas fa-map-pin"></i> Rajasthan &amp; Karnataka</div>
    </div>

    <!-- 5) Onion -->
    <div class="product-card">
      <div class="product-image" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23b8863d%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22 ry=%222%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/><polyline points=%2221 15 16 10 5 21%22/></svg>'); background-size: 50px 50px;"></div>
      <span class="category-tag">Fresh produce</span>
      <h3>Fresh Onion</h3>
      <p>Premium red &amp; white onions, sorted, clean, 25kg &amp; 50kg mesh bags.</p>
      <div class="origin"><i class="fas fa-map-pin"></i> Maharashtra &amp; Gujarat</div>
    </div>

    <!-- 6) Handloom Khan Jewellery & Doormat Rangoli -->
    <div class="product-card">
      <div class="product-image" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23b8863d%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22 ry=%222%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/><polyline points=%2221 15 16 10 5 21%22/></svg>'); background-size: 50px 50px;"></div>
      <span class="category-tag">Handicraft</span>
      <h3>Khan Jewellery &amp; Rangoli Doormat</h3>
      <p>Handcrafted kundan-style jewellery &amp; vibrant rangoli doormats (cotton/jute).</p>
      <div class="origin"><i class="fas fa-map-pin"></i> Rajasthan &amp; Gujarat</div>
    </div>

    <!-- 7) Book-keeping Data Entry Work -->
    <div class="product-card card-service">
      <div class="product-image" style="background-image: url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23b8863d%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22 ry=%222%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/><polyline points=%2221 15 16 10 5 21%22/></svg>'); background-size: 50px 50px;"></div>
      <span class="category-tag">Service · BPO</span>
      <h3>Book-keeping &amp; Data Entry</h3>
      <p>Accurate, secure, and timely financial data entry, reconciliations &amp; reporting.</p>
      <div class="origin"><i class="fas fa-clock"></i> 24h turnaround · ISO certified</div>
    </div>

  </div>

  <!-- INQUIRY SECTION with form -->
  <section class="inquiry-section">
    <div class="inquiry-info">
      <h3>Get in touch</h3>
      <p>Have a question or want to place an order? Reach out to us.</p>
      <div class="contact-detail"><i class="fas fa-envelope"></i> info@daneshwariglobal.com</div>
      <div class="contact-detail"><i class="fas fa-phone-alt"></i> +91 9834196880</div>
      <div class="contact-detail"><i class="fab fa-whatsapp"></i> +91 9834196880</div>
      <div class="contact-detail"><i class="fas fa-map-pin"></i> 102 C, 64 Bhavani Peth, Solapur – 413002</div>
    </div>
    <div class="inquiry-form">
      <form action="#" method="POST">
        <input type="text" name="name" placeholder="Full Name *" required />
        <input type="email" name="email" placeholder="Email Address *" required />
        <input type="tel" name="phone" placeholder="Phone Number" />
        <select name="product">
          <option value="">Select product of interest</option>
          <option>Terry Towel</option>
          <option>Ilkal Saree</option>
          <option>Rice (1121 / 1509 / Sona Masoori)</option>
          <option>Ilkal Granite & White Stone</option>
          <option>Fresh Onion</option>
          <option>Khan Jewellery & Rangoli Doormat</option>
          <option>Book-keeping & Data Entry</option>
        </select>
        <textarea name="message" placeholder="Your message or inquiry details..."></textarea>
        <button type="submit"><i class="fas fa-paper-plane"></i> Send Inquiry</button>
      </form>
    </div>
  </section>

